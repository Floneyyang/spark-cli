[package]
name = "spark-cli"
version = "0.1.0"
edition = "2024"
description = "A small AI assistant for your terminal"

[[bin]]
name = "spark"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustyline = "15"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "signal"] }

[dev-dependencies]
tempfile = "3"
